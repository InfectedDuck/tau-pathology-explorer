# Production server for the static dist/ build.
# try_files gives SPA fallback so shareable deep links (?stage=2&sel=…)
# survive refresh / direct navigation instead of 404ing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed build assets; never cache the entry HTML.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
